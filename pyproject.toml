[project]
name = "beamtime-server"
version = "0.1.1"
description = "Backend server for the beamtime application. It is used to create experiment folders, DOIs and cloud links (Globus/Nextcloud) for experiment data."
readme = "README.md"
authors = [
    { name = "Christofanis Skordas", email = "55315750+skordaschristofanis@users.noreply.github.com" },
]
maintainers = [
    { name = "Christofanis Skordas", email = "55315750+skordaschristofanis@users.noreply.github.com" },
]
requires-python = "==3.14.*"
dependencies = [
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.6",
    "psycopg2-binary>=2.9.13",
]

[project.urls]
Homepage = "https://github.com/seescience/beamtime-server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pre-commit>=4.7.0", "pytest>=9.2.0", "ruff>=0.17.3"]

[tool.ruff]
exclude = [
    ".eggs",
    ".git",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "build",
    "dist",
]
line-length = 160
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
