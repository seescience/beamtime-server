# SPDX-License-Identifier: MIT

[project]
name = "beamtime-server"
dynamic = ["version"]
authors = [{ name = "Christofanis Skordas", email = "skordasc@uchicago.edu" }]
maintainers = [{ name = "Christofanis Skordas", email = "skordasc@uchicago.edu" }]
description = "Backend server for the SEES beamtime app."
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE.txt"]
classifiers = [
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
requires-python = "==3.14.*"
dependencies = [
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.6",
    "psycopg2-binary>=2.9.13",
]

[dependency-groups]
dev = ["pre-commit>=4.7.0", "pytest>=9.2.0", "ruff>=0.17.3"]

[project.scripts]
beamtime-server = "beamtime_server:main"

[project.urls]
Homepage = "https://github.com/seescience/beamtime-server"
Issues = "https://github.com/seescience/beamtime-server/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beamtime_server"]

[tool.hatch.version]
source = "vcs"

[tool.ruff]
exclude = [
    ".eggs",
    ".git",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "build",
    "dist",
]
line-length = 160
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
